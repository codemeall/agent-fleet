# Provider adapters: the single source for how each agent CLI is launched,
# checked and stopped. ~/.config/agent-fleet/config.toml overrides any field.
#
# launch placeholders: {bin} is trusted shell setup; model/effort/prompt are quoted data.
# Shipped model IDs are account-dependent examples; verify them before routing.
# quit: sequence sent to the pane; "enter", "escape", "tab" and "ctrl+c" are keys, anything else is text.
#   Start it with "escape" when the CLI's prompts treat Esc as No: an approval prompt takes the quit's Enter as its
#   highlighted Yes, so without it `fleet stop` would approve the worker's pending command.
# prompt_marks: screen text that only an open prompt shows (an approval, a menu). While one is on the worker's
#   screen, send, grant, approve and the gate loop type nothing: its Enter would answer the prompt for the owner.
# login: a cheap command that needs no model call; ready when its output contains login_ok.
# models: lists the account's model IDs (a JSON catalog, or `id<TAB>name` / `id - name` lines);
#   doctor checks every tier model, and effort where the catalog lists efforts, against it. model_config + default_home: where a CLI that cannot list
#   models keeps its default model, shown as a hint. model_note: shown instead when neither applies.
# models_allow: the models the lead may choose, as a list or a table of model ID = family.
#   With a live `models` list it narrows that list; without one it is the list. Plans and
#   review launches outside it are refused. Tier models always count as allowed.
#   A user's models_allow replaces the shipped one.
# model_families: model ID = family for a mixed adapter, without narrowing what the lead may choose.
# family_prefixes: model ID prefix = family, for IDs no exact entry or tier names; the longest match wins.
# efforts: effort levels the CLI accepts, for a CLI that cannot report them per model.
#   Tier efforts, plans and review launches outside it are refused.
# tiers: model + effort per ticket weight (see references/routing.md).
# family: model family, used to pick a reviewer from a different family.
# account_env: the CLI's account-directory variable. Fleet clears it unless `env` sets it,
#   so an adapter never borrows the account the lead happens to run under.
# session/resume: argument fragments for the launch line's {session} slot; {id} is a UUID Fleet picks.
#   `session` names the session at launch, `resume` continues it (`fleet launch --resume`). Both are
#   needed; without them the slot is dropped and the worker cannot be resumed.
# extends: copy another adapter (all fields except `enabled`) and override some, e.g. a second
#   subscription: extends = "claude" + env = { CLAUDE_CONFIG_DIR = "~/.claude-co" }.
#   `fleet account add <name> --from <adapter> --dir <path>` writes one for you.
# enabled: whether plans, launches and steers may use the adapter (default true). The owner turns one on or off
#   with `fleet provider enable|disable <name>`, which writes ~/.config/agent-fleet/config.toml.
# placeholder: true for an adapter nobody has checked. Doctor fails it, and plan, launch, steer and
#   `fleet provider enable` refuse it, until the owner fills it in, tests it and sets placeholder = false.
# trust: how launch marks the repo trusted when [defaults] auto_trust = true (off by default):
#   claude-config sets the project's hasTrustDialogAccepted in the account's .claude.json, codex-flag passes the
#   trust as a session-only -c override, agy-settings adds the repo to agy's trustedWorkspaces.
#   In a worktree run (fleet init --isolation worktree) it marks the checkout and the worker's own tree.
# add_dir: a launch fragment with a {dir} slot that lets a worker in its own worktree reach the run's folder
#   (.fleet/runs/<run>/: its prompt, inbox, report and ticket copy). Launch adds it after {bin}, only in a worktree
#   run. Without it, a CLI that keeps to its working directory asks before those reads and writes.
# profiles: how each role launches. profiles.worker runs implementation tickets; profiles.review runs reviewers and
#   investigate tickets, which write only their report. `args` fills the launch line's {profile} slot (trusted, not
#   quoted; the slot is dropped when empty). `level` is what that launch lets the CLI do without the owner answering
#   in its pane: read-only < workspace-write < full-access. Launch refuses, and doctor fails, a profile above
#   [defaults] permission_ceiling (default workspace-write). A launch line without {profile} runs as written for
#   every role, at the worker's level. See references/providers.md#permission-profiles.
# bin_aliases: other names the same CLI installs under; doctor names one it finds when `bin` is missing.
# headless: a one-shot, non-interactive launch line for reviewers and investigate tickets ({bin}, {model}, {effort},
#   {prompt}; no {session} or {profile}). Its own flags must deny every write and every prompt, so it counts as
#   read-only. Its runner saves the CLI's final message as the report and the usage it prints for `fleet cost`.
# review_transport: "tui" (default) or "headless", here or under [defaults]; headless needs a `headless` line, and
#   an adapter without one keeps its TUI under a [defaults] headless. Implementation workers always run in a TUI.
#   See references/providers.md#headless-reviewers.
# signals: how a worker tells `fleet wait` about its turns. Without one, wait watches the screen (STALLED).
#   claude-settings, through the launch line's {settings} slot, writes .fleet/runs/<run>/settings/<id>.json and passes
#   --settings <path>: a guard that refuses edits outside the worker's own files and report, and events wait reads
#   (a permission prompt, idle). See references/providers.md#claude-hooks.
#   codex-notify, through the {signals} slot, passes -c notify=[...]: Codex runs `fleet _notify` after each turn, and
#   a turn that ends without a hand-back wakes IDLE. It replaces the account's own notify for that worker.
#   "" turns signals off; so does a launch line without the slot. There is no cursor-hooks: Cursor's hooks were not
#   checked against cursor-agent. See references/providers.md#turn-signals.
# hooks: the older name for signals; it takes only claude-settings or "". An owner's `hooks = ""` still turns them off.

[providers.claude]
enabled = true
bin = "claude"
launch = "{bin} {session} --model {model} --effort {effort} {profile} {settings} {prompt}"
signals = "claude-settings"
# Workers pass --permission-mode acceptEdits: the narrowest mode that still edits files in the working
# directory without the owner at the pane. manual and default ask first, dontAsk and plan do not edit, and
# auto and bypassPermissions are broader than this profile's workspace-write ceiling. acceptEdits also approves
# mkdir, touch, rm, rmdir, mv, cp and sed in that directory, where the hook guard does not look. Ask rules make
# rm, rmdir, mv, cp and sed prompt (ask is checked before the mode). Under acceptEdits, redirects into the
# working directory run without a prompt, and so do mkdir and touch. In shared isolation those unprompted writes
# can overwrite uncommitted owner edits, including gitignored files. bash -c, absolute paths such as /bin/rm, and
# tee are missed by the ask rules, but they still prompt unless the owner allowed them, because acceptEdits
# auto-approves file edits, its filesystem commands (mkdir, touch, rm, rmdir, mv, cp, sed), and the read-only
# set; other commands prompt. Edit deny rules block edits, redirects, sed and tee into the denied run paths. A
# script that opens files itself (python -c) is not covered. The edit hook does not see shell
# commands. The scope check misses gitignored files, scope_ignore paths, and .fleet/runs/. scope_permissions only
# adds allow rules; it does not change this mode.
# Doctor does not read settings.json for permissions.defaultMode; that check is still open.
# Reviewers pin manual mode (`claude --help` 2.1.318: Claude asks before each edit and command), so a looser
# defaultMode never reaches them. With hooks on, the guard lets a reviewer write only its report and its settings
# allow that one file, so the report write needs no answer. Hooks never change the mode, so a guard that cannot run
# leaves every other edit asking: the level stays read-only either way.
profiles.worker = { args = "--permission-mode acceptEdits", level = "workspace-write" }
profiles.review = { args = "--permission-mode manual", level = "read-only" }
# Headless (review_transport = "headless"): `-p` with nobody to answer (`--permission-prompts none`) in manual mode,
# so every edit and every command that would ask is denied, not left waiting. JSON output carries the result and usage.
headless = "{bin} -p --output-format json --model {model} --effort {effort} --permission-mode manual --permission-prompts none {prompt}"
session = "--session-id {id}"
resume = "--resume {id}"
# Esc first: at a permission prompt ("Do you want to proceed? > 1. Yes") Esc is No and /exit's Enter would be Yes.
# Checked on Claude Code 2.1.326 in tmux: Esc at an idle prompt changes nothing, and at a permission prompt it denies
# the command before /exit quits.
quit = ["escape", "/exit", "enter"]
# The permission prompt's footer reads "Esc to cancel · Tab to amend"; marks stay ASCII, which tmux never mangles.
prompt_marks = ["Esc to cancel"]
login = "claude auth status"
login_ok = '"loggedIn": true'
account_env = "CLAUDE_CONFIG_DIR"
trust = "claude-config"
# `claude --help` 2.1.318: --add-dir <directories...> takes several values, so the = form keeps it to one.
add_dir = "--add-dir={dir}"
model_note = "aliases follow the current model"
# The CLI cannot list models, so this is the list. Aliases (from `claude --help`) follow the newest model;
# full IDs pin one. Only a launch proves the account offers a model.
models_allow = ["opus", "sonnet", "fable", "claude-opus-5-5", "claude-sonnet-5-5", "claude-fable-5-1", "claude-haiku-5-5"]
efforts = ["low", "medium", "high", "xhigh", "max"]    # from `claude --help`; per-model support is checked only at launch
family = "anthropic"
plugins = true
max = 2
tiers.heavy = { model = "opus", effort = "high" }
tiers.standard = { model = "sonnet", effort = "high" }
tiers.light = { model = "sonnet", effort = "medium" }
tiers.review = { model = "opus", effort = "high" }

# Example second subscription. Sign it in (CLAUDE_CONFIG_DIR=~/.claude-co claude), then enable it.
[providers.claude-co]
extends = "claude"
enabled = false
env = { CLAUDE_CONFIG_DIR = "~/.claude-co" }
plugins = false
max = 1

[providers.codex]
enabled = true
bin = "codex"
# check_for_update_on_startup=false: an "Update available" screen would stall a worker before its prompt runs.
# notice.hide_rate_limit_model_nudge=true: near a usage limit, Codex ends each turn on an "Approaching rate limits:
# switch to a cheaper model?" menu with the switch highlighted. Keys Fleet types then (stop's /quit, fleet send's
# reply) go nowhere and their Enter switches the worker's model for the rest of its session. Checked on Codex 0.167;
# an older Codex warns about an unknown notice key and starts anyway.
launch = "{bin} -m {model} -c model_reasoning_effort={effort} -c check_for_update_on_startup=false -c notice.hide_rate_limit_model_nudge=true {signals} {profile} {prompt}"
# notify (openai/codex, codex-rs/hooks/src/legacy_notify.rs): runs in the TUI and in exec, after each turn, with an
# agent-turn-complete JSON as its last argument. Any -c also keeps the TUI off a shared app-server daemon.
signals = "codex-notify"
# A TUI reviewer must write its report; under -s read-only that write, and any check that writes a cache, would wait
# for the owner's approval. So review runs the worker's sandbox, and only Fleet's review contract keeps it to its report.
profiles.worker = { args = "-s workspace-write -a on-request", level = "workspace-write" }
profiles.review = { args = "-s workspace-write -a on-request", level = "workspace-write" }
# Headless (review_transport = "headless"): `codex exec` under -s read-only, with approval_policy pinned to never
# (exec's default, which an owner's auto_review would otherwise lift), so a write fails instead of escalating and
# nothing waits for an answer. Its final message is the report; --json streams events and usage.
headless = "{bin} exec --json -m {model} -c model_reasoning_effort={effort} -s read-only -c approval_policy=never {prompt}"
# Esc first: at an approval prompt ("Would you like to run the following command? > 1. Yes, proceed") Esc is No and
# /quit's Enter would be Yes. Checked on Codex 0.167.0 in tmux: Esc at an idle prompt changes nothing, and at an
# approval prompt it denies the command before /quit quits.
quit = ["escape", "/quit", "enter"]
# The approval prompt's footer, and the footer of a menu such as the rate-limit one ("enter select · esc back").
prompt_marks = ["Press enter to confirm or esc to cancel", "enter select"]
login = "codex login status"
login_ok = "Logged in"
account_env = "CODEX_HOME"
trust = "codex-flag"
# openai/codex codex-rs/utils/cli/src/shared_options.rs: --add-dir DIR, "Additional directories that should be
# writable alongside the primary workspace", so the workspace-write sandbox lets the worker write its report.
add_dir = "--add-dir {dir}"
models = "codex debug models"
model_config = "config.toml"
default_home = "~/.codex"
family = "openai"
plugins = false
max = 2
tiers.heavy = { model = "gpt-6.1-sol", effort = "high" }
tiers.standard = { model = "gpt-6.1-sol", effort = "medium" }
tiers.light = { model = "gpt-6-luna", effort = "medium" }
tiers.review = { model = "gpt-6.1-sol", effort = "high" }

[providers.cursor]
enabled = true
bin = "cursor-agent"
bin_aliases = ["agent"]   # Cursor's newer name for the same CLI, per its docs; not checked here
# Cursor has no effort flag: effort is part of the model id.
launch = "{bin} --model {model} --trust {profile} {prompt}"
# Edits apply without asking; commands ask unless the owner's Cursor config allows them (Fleet never passes --force).
# No interactive mode Fleet has checked both stops edits and lets a reviewer write its report, so review runs as the worker.
# No signals: Cursor's hooks (stop, afterFileEdit) were not checked against cursor-agent, so wait watches the screen.
profiles.worker = { args = "", level = "workspace-write" }
profiles.review = { args = "", level = "workspace-write" }
quit = ["/quit", "enter"]
login = "cursor-agent status"
login_ok = "Logged in"
models = "cursor-agent --list-models"
family = "mixed"
# No models_allow: the lead may choose any model `cursor-agent --list-models` offers.
# family_prefixes below gives each a family for cross-family review; `auto` has none.
plugins = false
max = 2
tiers.heavy = { model = "grok-4.7-high", family = "xai" }
tiers.standard = { model = "kimi-k3-high", family = "moonshot" }
tiers.light = { model = "grok-4.7-high-fast", family = "xai" }
tiers.review = { model = "muse-spark-1.3-max", family = "meta" }

[providers.cursor.family_prefixes]
"claude-" = "anthropic"
"gpt-" = "openai"
"gemini-" = "google"
"grok-" = "xai"
"cursor-grok-" = "xai"
"kimi-" = "moonshot"
"muse-" = "meta"
"composer-" = "cursor"
"glm-" = "zhipu"
"deepseek-" = "deepseek"

# Antigravity: checked live with agy 1.3.0 (launch, follow-up, /exit). Disabled until the owner turns it on.
# Models and efforts below are from `agy models` and `agy --help` on 1.3.1 and 1.4.8 (same lists); neither was launched.
[providers.agy]
enabled = false
bin = "agy"
launch = "{bin} --model {model} --effort {effort} {profile} -i {prompt}"
# accept-edits: file edits are approved automatically, shell commands still ask. No other mode was checked, so
# review runs as the worker.
profiles.worker = { args = "--mode accept-edits", level = "workspace-write" }
profiles.review = { args = "--mode accept-edits", level = "workspace-write" }
trust = "agy-settings"
quit = ["/exit", "enter"]
login = "agy models"
login_ok = "gemini"
models = "agy models"
efforts = ["low", "medium", "high", "xhigh", "max"]   # from `agy --help`; the model ID also names a thinking level
family = "mixed"
# Families by name, so models older or newer agy versions list keep one (Gemini 3.1 Pro on 1.3.0, say).
family_prefixes = { "gemini-" = "google", "claude-" = "anthropic", "gpt-oss-" = "openai" }
plugins = false
max = 1
# agy 1.3.1 and later offer no Gemini Pro, so heavy and review use Flash at its highest thinking level.
tiers.heavy = { model = "gemini-3.8-flash-high", effort = "high", family = "google" }
tiers.standard = { model = "gemini-3.8-flash-high", effort = "high", family = "google" }
tiers.light = { model = "gemini-3.8-flash-medium", effort = "medium", family = "google" }
tiers.review = { model = "gemini-3.8-flash-high", effort = "high", family = "google" }

# OpenCode: checked live with opencode 1.18.34 (launch, follow-up, /exit). Disabled until the owner turns it on.
# Model IDs are provider/model; the shipped tiers assume OpenRouter (`opencode auth login`).
# The TUI has no effort flag (only `opencode run` takes --variant), so tiers carry none.
[providers.opencode]
enabled = false
bin = "opencode"
launch = "{bin} --model {model} {profile} --prompt {prompt}"
# Its default build agent runs every tool without asking, so both profiles are honestly full-access, and the default
# permission_ceiling (workspace-write) refuses them. The owner either raises the ceiling, or sets `permission` in
# opencode.json (edits allowed, bash and webfetch "ask") and lowers these levels to workspace-write.
profiles.worker = { args = "", level = "full-access" }
profiles.review = { args = "", level = "full-access" }
quit = ["/exit", "enter"]
login = "opencode models openrouter"   # lists only providers with credentials; point it at yours
login_ok = "openrouter/"
models = "opencode models"
family = "mixed"
# No models_allow: the lead may choose any model `opencode models` lists for your configured providers.
# family_prefixes below covers labs serving their own models; resellers and fine-tune houses
# (nvidia, perplexity, openrouter/openrouter, most of opencode/) have none, so pass --family for those.
plugins = false
max = 1
tiers.heavy = { model = "openrouter/z-ai/glm-5.3", family = "zhipu" }
tiers.standard = { model = "openrouter/qwen/qwen3.7-plus", family = "alibaba" }
tiers.light = { model = "openrouter/deepseek/deepseek-v4-flash", family = "deepseek" }
tiers.review = { model = "openrouter/deepseek/deepseek-v4-pro", family = "deepseek" }

[providers.opencode.family_prefixes]
"openrouter/anthropic/" = "anthropic"
"openrouter/~anthropic/" = "anthropic"
"openrouter/openai/" = "openai"
"openrouter/~openai/" = "openai"
"huggingface/openai/" = "openai"
"openrouter/google/" = "google"
"openrouter/~google/" = "google"
"huggingface/google/" = "google"
"openrouter/x-ai/" = "xai"
"openrouter/~x-ai/" = "xai"
"openrouter/qwen/" = "alibaba"
"huggingface/Qwen/" = "alibaba"
"openrouter/z-ai/" = "zhipu"
"openrouter/~z-ai/" = "zhipu"
"huggingface/zai-org/" = "zhipu"
"opencode/glm-" = "zhipu"
"openrouter/deepseek/" = "deepseek"
"openrouter/~deepseek/" = "deepseek"
"huggingface/deepseek-ai/" = "deepseek"
"opencode/deepseek-" = "deepseek"
"openrouter/moonshotai/" = "moonshot"
"openrouter/~moonshotai/" = "moonshot"
"huggingface/moonshotai/" = "moonshot"
"openrouter/minimax/" = "minimax"
"huggingface/MiniMaxAI/" = "minimax"
"openrouter/meta-llama/" = "meta"
"openrouter/meta/" = "meta"
"huggingface/meta-llama/" = "meta"
"meta/" = "meta"
"openrouter/mistralai/" = "mistral"
"openrouter/cohere/" = "cohere"
"openrouter/amazon/" = "amazon"
"openrouter/microsoft/" = "microsoft"
"openrouter/ibm-granite/" = "ibm"
"openrouter/tencent/" = "tencent"
"huggingface/tencent/" = "tencent"
"openrouter/xiaomi/" = "xiaomi"
"huggingface/XiaomiMiMo/" = "xiaomi"
"opencode/mimo-" = "xiaomi"
"openrouter/bytedance-seed/" = "bytedance"
"openrouter/stepfun/" = "stepfun"
"huggingface/stepfun-ai/" = "stepfun"

# Placeholders, not supported providers: no Grok or Muse CLI has been checked, so the binary name, flags,
# login check, model list and tiers below are unknown or guesses. Grok and Muse models work today through
# the cursor adapter (grok-4.7-high, muse-spark-1.3-max). See references/providers.md#placeholder-adapters.
[providers.grok]
enabled = false
placeholder = true
bin = "grok"
launch = "{bin} --model {model} {prompt}"
quit = ["/quit", "enter"]
family = "xai"
plugins = false
max = 1

[providers.muse]
enabled = false
placeholder = true
bin = "muse"
launch = "{bin} --model {model} {prompt}"
quit = ["/quit", "enter"]
family = "meta"
plugins = false
max = 1

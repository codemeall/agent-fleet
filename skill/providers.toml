# Placeholders, not supported providers: no Grok or Muse CLI has been checked, so the binary name, flags,
# login check, model list and tiers below are unknown or guesses. Grok and Muse models work today through
# the cursor adapter (grok-4.7-high, muse-spark-1.3-max). See references/providers.md#placeholder-adapters.
[providers.grok]
enabled = false
placeholder = true
bin = "grok"
launch = "{bin} --model {model} {prompt}"
quit = ["/quit", "enter"]
family = "xai"
plugins = false
max = 1

[providers.muse]
enabled = false
placeholder = true
bin = "muse"
launch = "{bin} --model {model} {prompt}"
quit = ["/quit", "enter"]
family = "meta"
plugins = false
max = 1

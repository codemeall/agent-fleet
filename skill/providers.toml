# Provider adapters: the single source for how each agent CLI is launched,
# checked and stopped. ~/.config/agent-fleet/config.toml overrides any field.
#
# launch placeholders: {bin} is trusted shell setup; model/effort/prompt are quoted data.
# Shipped model IDs are account-dependent examples; verify them before routing.
# quit: sequence sent to the pane; "enter" and "ctrl+c" are keys, anything else is text.
# login: a cheap command that needs no model call; ready when its output contains login_ok.
# models: lists the account's model IDs (a JSON catalog, or `id<TAB>name` / `id - name` lines);
#   doctor checks every tier model, and effort where the catalog lists efforts, against it. model_config + default_home: where a CLI that cannot list
#   models keeps its default model, shown as a hint. model_note: shown instead when neither applies.
# models_allow: the models the lead may choose, as a list or a table of model ID = family.
#   With a live `models` list it narrows that list; without one it is the list. Plans and
#   review launches outside it are refused. Tier models always count as allowed.
#   A user's models_allow replaces the shipped one.
# model_families: model ID = family for a mixed adapter, without narrowing what the lead may choose.
# efforts: effort levels the CLI accepts, for a CLI that cannot report them per model.
#   Tier efforts, plans and review launches outside it are refused.
# tiers: model + effort per ticket weight (see references/routing.md).
# family: model family, used to pick a reviewer from a different family.
# account_env: the CLI's account-directory variable. Fleet clears it unless `env` sets it,
#   so an adapter never borrows the account the lead happens to run under.
# session/resume: argument fragments for the launch line's {session} slot; {id} is a UUID Fleet picks.
#   `session` names the session at launch, `resume` continues it (`fleet launch --resume`). Both are
#   needed; without them the slot is dropped and the worker cannot be resumed.
# extends: copy another adapter (all fields except `enabled`) and override some, e.g. a second
#   subscription: extends = "claude" + env = { CLAUDE_CONFIG_DIR = "~/.claude-co" }.
#   `fleet account add <name> --from <adapter> --dir <path>` writes one for you.
# trust: how launch marks the repo trusted when [defaults] auto_trust = true (off by default):
#   claude-config sets the project's hasTrustDialogAccepted in the account's .claude.json, codex-flag passes the
#   trust as a session-only -c override, agy-settings adds the repo to agy's trustedWorkspaces.

[providers.claude]
enabled = true
bin = "claude"
launch = "{bin} {session} --model {model} --effort {effort} {prompt}"
session = "--session-id {id}"
resume = "--resume {id}"
quit = ["/exit", "enter"]
login = "claude auth status"
login_ok = '"loggedIn": true'
account_env = "CLAUDE_CONFIG_DIR"
trust = "claude-config"
model_note = "aliases follow the current model"
models_allow = ["opus", "sonnet"]
efforts = ["low", "medium", "high", "xhigh", "max"]    # from `claude --help`; per-model support is checked only at launch
family = "anthropic"
plugins = true
max = 2
tiers.heavy = { model = "opus", effort = "high" }
tiers.standard = { model = "sonnet", effort = "high" }
tiers.light = { model = "sonnet", effort = "medium" }
tiers.review = { model = "opus", effort = "high" }

# Example second subscription. Sign it in (CLAUDE_CONFIG_DIR=~/.claude-co claude), then enable it.
[providers.claude-co]
extends = "claude"
enabled = false
env = { CLAUDE_CONFIG_DIR = "~/.claude-co" }
plugins = false
max = 1

[providers.codex]
enabled = true
bin = "codex"
# check_for_update_on_startup=false: an "Update available" screen would stall a worker before its prompt runs.
launch = "{bin} -m {model} -c model_reasoning_effort={effort} -c check_for_update_on_startup=false -s workspace-write -a on-request {prompt}"
quit = ["/quit", "enter"]
login = "codex login status"
login_ok = "Logged in"
account_env = "CODEX_HOME"
trust = "codex-flag"
models = "codex debug models"
model_config = "config.toml"
default_home = "~/.codex"
family = "openai"
plugins = false
max = 2
tiers.heavy = { model = "gpt-6.1-sol", effort = "high" }
tiers.standard = { model = "gpt-6.1-sol", effort = "medium" }
tiers.light = { model = "gpt-6-luna", effort = "high" }
tiers.review = { model = "gpt-6.1-sol", effort = "high" }

[providers.cursor]
enabled = true
bin = "cursor-agent"
# Cursor has no effort flag: effort is part of the model id.
launch = "{bin} --model {model} --trust {prompt}"
quit = ["/quit", "enter"]
login = "cursor-agent status"
login_ok = "Logged in"
models = "cursor-agent --list-models"
family = "mixed"
# Starter set; `fleet models cursor --all` lists the rest. Families feed cross-family review.
models_allow = { "grok-4.7-high" = "xai", "grok-4.7-high-fast" = "xai", "kimi-k3-high" = "moonshot", "muse-spark-1.3-max" = "meta", "composer-2.5" = "cursor", "gpt-5.3-codex-high" = "openai", "claude-opus-5-thinking-high" = "anthropic", "gemini-3.7-flash-high" = "google" }
plugins = false
max = 2
tiers.heavy = { model = "grok-4.7-high", family = "xai" }
tiers.standard = { model = "kimi-k3-high", family = "moonshot" }
tiers.light = { model = "grok-4.7-high-fast", family = "xai" }
tiers.review = { model = "muse-spark-1.3-max", family = "meta" }

# Antigravity: checked live with agy 1.3.0 (launch, follow-up, /exit). Disabled until the owner turns it on.
[providers.agy]
enabled = false
bin = "agy"
launch = "{bin} --model {model} --effort {effort} --mode accept-edits -i {prompt}"
trust = "agy-settings"
quit = ["/exit", "enter"]
login = "agy models"
login_ok = "gemini"
models = "agy models"
efforts = ["low", "medium", "high", "max"]   # from `agy --help`; the model ID also names a thinking level
family = "mixed"
# Families for every model `agy models` lists (agy 1.3.0); add new IDs here or pass --family.
model_families = { "gemini-3.8-flash-high" = "google", "gemini-3.8-flash-medium" = "google", "gemini-3.8-flash-low" = "google", "gemini-3.7-flash-high" = "google", "gemini-3.7-flash-medium" = "google", "gemini-3.7-flash-low" = "google", "gemini-3.6-flash-high" = "google", "gemini-3.6-flash-medium" = "google", "gemini-3.6-flash-low" = "google", "gemini-3.1-pro-high" = "google", "gemini-3.1-pro-low" = "google", "claude-sonnet-4-6" = "anthropic", "claude-opus-4-6-thinking" = "anthropic", "gpt-oss-120b-medium" = "openai" }
plugins = false
max = 1
tiers.heavy = { model = "gemini-3.1-pro-high", effort = "high", family = "google" }
tiers.standard = { model = "gemini-3.8-flash-high", effort = "high", family = "google" }
tiers.light = { model = "gemini-3.8-flash-medium", effort = "medium", family = "google" }
tiers.review = { model = "gemini-3.1-pro-high", effort = "high", family = "google" }

# OpenCode: checked live with opencode 1.18.34 (launch, follow-up, /exit). Disabled until the owner turns it on.
# Model IDs are provider/model; the shipped tiers assume OpenRouter (`opencode auth login`).
# The TUI has no effort flag (only `opencode run` takes --variant), so tiers carry none.
[providers.opencode]
enabled = false
bin = "opencode"
launch = "{bin} --model {model} --prompt {prompt}"
quit = ["/exit", "enter"]
login = "opencode models openrouter"   # lists only providers with credentials; point it at yours
login_ok = "openrouter/"
models = "opencode models"
family = "mixed"
# Starter set; `fleet models opencode --all` lists every model your configured providers offer.
models_allow = { "openrouter/z-ai/glm-5.3" = "zhipu", "openrouter/qwen/qwen3.7-plus" = "alibaba", "openrouter/deepseek/deepseek-v4-pro" = "deepseek", "openrouter/deepseek/deepseek-v4-flash" = "deepseek", "openrouter/moonshotai/kimi-k2.7-code" = "moonshot", "openrouter/minimax/minimax-m3" = "minimax" }
plugins = false
max = 1
tiers.heavy = { model = "openrouter/z-ai/glm-5.3", family = "zhipu" }
tiers.standard = { model = "openrouter/qwen/qwen3.7-plus", family = "alibaba" }
tiers.light = { model = "openrouter/deepseek/deepseek-v4-flash", family = "deepseek" }
tiers.review = { model = "openrouter/deepseek/deepseek-v4-pro", family = "deepseek" }

# Planned: turned on once the CLI is set up and its adapter is checked.
[providers.grok]
enabled = false
bin = "grok"
launch = "{bin} --model {model} {prompt}"
quit = ["/quit", "enter"]
family = "xai"
plugins = false
max = 1

[providers.muse]
enabled = false
bin = "muse"
launch = "{bin} --model {model} {prompt}"
quit = ["/quit", "enter"]
family = "meta"
plugins = false
max = 1

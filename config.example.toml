# Optional ~/.config/agent-fleet/config.toml overrides.
# fleet providers prints the merged configuration. No workspace is pinned.
[defaults]
routing = "auto"
prefer = ["claude", "codex", "cursor"]
max_parallel = 3
review = "cross-heavy"
# Reviewer launches per ticket (1 to 5). Past them, Fleet refuses the next repair or review and the lead brings
# you the open findings: accept as is, drop the ticket, or allow one more round (--extra-round "<your words>").
# review_rounds = 2
# Make every `fleet wait` a gate loop (as `fleet wait --gate`): when a running worker hands back a ticket with
# planned check commands, Fleet runs them first and sends a failure straight back to the worker, waking the lead
# only for a pass, a scope problem, or once gate_rounds failures (1 to 5) have gone back. Off by default.
# gate = true
# gate_rounds = 2
# Mark the repo trusted in Claude, Codex and Antigravity before each launch, so their first-run
# "trust this folder?" screen does not stall a worker. Off by default; only the owner turns it on.
# auto_trust = true
# The widest launch profile Fleet will start: "read-only", "workspace-write" (the default) or "full-access".
# Launch refuses, and doctor fails, a provider profile above it; OpenCode's build agent is full-access.
# permission_ceiling = "workspace-write"
# Claude workers launch with Fleet's hooks: a guard that refuses edits outside the ticket's files and the worker's
# report, and events that wake the lead on a permission prompt (PERMISSION) or an idle worker (IDLE). With
# scope_permissions on, Claude workers also auto-accept edits (acceptEdits: the guard keeps them in scope) and run
# their ticket's planned check commands without asking; nothing else is allowed. Off by default; only you turn it on.
# scope_permissions = true
# Where workers run: "cmux" (visible panes beside the lead, macOS), "tmux" (headless windows in a detached
# session; watch them with `fleet agents`) or "auto" (the default: cmux inside cmux, else tmux).
# backend = "tmux"
# Headless workers use Fleet's own tmux server (tmux -L fleet). "" puts their sessions on your default server,
# so `tmux ls` lists them and, inside tmux, `fleet attach` switches to a worker instead of nesting.
# tmux_socket = "fleet"
# Caps per run (0, the default, means no cap). Once a run reaches one, Fleet refuses new workers and the lead brings
# it to you; running workers are never stopped. A run keeps the values it was started with: raising one here
# applies to new runs, or start a follow-up run (fleet init) for the remaining work. fleet cost shows the use.
# max_workers counts every worker launch: writers, reviewers, investigators, relaunches and resumes.
# max_workers = 20
# max_wall_minutes sums every worker's wall time, running workers included.
# max_wall_minutes = 600
# Paths the whole-tree scope check never blames on a worker, besides .fleet/ and gitignored files. "name/" is a
# directory at any depth, "a/b/" is anchored at the root, anything else is an exact path. Your list replaces this one.
# scope_ignore = [".scratch/", "node_modules/", "__pycache__/", ".pytest_cache/", ".mypy_cache/", ".ruff_cache/"]
# What plan and add do with a ticket whose checks hold neither a {"run": …} command nor a {"manual": "<reason>"}
# marker: "refuse" it (the default) or "warn" and save it.
# check_policy = "refuse"
# Set only when you intentionally target a validated cmux workspace:
# workspace = "workspace:3"

# Optional lead context marks in tokens (none by default). Run commands then show the lead's size from warn_at and
# dumb_at; the lead only tells you, and hands off or prepares for compaction when you ask (fleet handoff).
# [lead_context.claude]
# warn_at = 500000
# dumb_at = 600000
# [lead_context.codex]
# warn_at = 150000
# dumb_at = 200000

# Models are account-dependent examples: verify availability before assigning work.
# [providers.codex.tiers.standard]
# model = "gpt-6-sol"
# effort = "medium"
# family = "openai"

# Turn providers on or off: `fleet provider enable|disable <name>` edits this file for you, then run
# fleet doctor <name>. Antigravity and OpenCode ship off; add a provider to defaults.prefer above for auto routing.
# OpenCode's shipped tiers assume OpenRouter; override its tiers and login check for another provider.
# grok and muse are placeholders and can't be turned on until filled in (see references/providers.md).
# [providers.agy]
# enabled = true
# [providers.opencode]
# enabled = true
# [providers.cursor]
# enabled = false

# Turn Claude's hooks off (reviewers then ask before every edit again, and wait falls back to STALLED):
# [providers.claude]
# hooks = ""

# Optional second account. Sign it in first (CLAUDE_CONFIG_DIR=~/.claude-co claude).
# Other accounts: fleet account add <name> --from claude|codex --dir <path>
# [providers.claude-co]
# enabled = true
# max = 1
